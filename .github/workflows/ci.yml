name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      # Includes real PDF generation/parsing tests and in-memory SQL tests.
      - name: Run tests (including receipt PDFs)
        run: npm test

      - name: Check types and tests
        run: npm run check

      - name: Build application
        run: npm run build
